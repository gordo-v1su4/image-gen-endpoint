[project]
name = "imagegen-endpoint"
version = "0.2.4"
description = "Production-ready image generation and editing API endpoint"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "pillow>=10.2.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "diffusers>=0.26.0",
    "transformers>=4.37.0",
    "accelerate>=0.26.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.20.0",
    "bitsandbytes>=0.42.0",
    "optimum>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.26.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
