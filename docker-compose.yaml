services:
  imagegen-endpoint:
    build:
      context: .
      dockerfile: Dockerfile
    image: image-gen-endpoint:latest
    restart: unless-stopped

    environment:
      # GGUF model paths
      - GGUF_MODELS_PATH=/opt/models/qwen-gguf
      - SD_CLI_PATH=/opt/stable-diffusion.cpp/build/bin/sd-cli
      # Optional: Enable CPU offload for systems with limited VRAM
      - OFFLOAD_TO_CPU=false
      # Optional: Enable verbose output for debugging
      - SD_VERBOSE=false
      # CUDA settings
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      # Download models on first start
      - DOWNLOAD_MODELS=true

    volumes:
      # Persistent storage for GGUF models (~31GB needed)
      # Models downloaded automatically on first container start:
      # - qwen-image-2512-Q4_K_M.gguf (~13GB)
      # - qwen-image-edit-2511-Q4_K_M.gguf (~13GB)
      # - Qwen2.5-VL-7B-Instruct-UD-Q4_K_XL.gguf (~4.5GB)
      # - qwen_image_vae.safetensors (~243MB)
      - gguf_models:/opt/models/qwen-gguf

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s  # 5 minutes for model download on first start

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gguf_models:
    # Map to host path in Coolify for persistent storage
    # Example: /data/imagegen-gguf-models
