services:
  imagegen-endpoint:
    build:
      context: .
      dockerfile: Dockerfile
    image: image-gen-endpoint:latest
    restart: unless-stopped

    environment:
      # HuggingFace cache for diffusers models
      - HF_HOME=/opt/models/huggingface
      # CUDA settings
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all

    volumes:
      # Persistent storage for HuggingFace/diffusers models
      # Qwen FP8 Lightning (~28GB) + FLUX Klein 4B (~10GB)
      - hf_cache:/opt/models/huggingface

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # 2 minutes for initial model loading

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hf_cache:
    # HuggingFace cache for all diffusers models
