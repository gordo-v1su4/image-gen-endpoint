services:
  imagegen-endpoint:
    image: docker.io/gordov1su4/imagegen-endpoint:latest
    restart: unless-stopped

    environment:
      - MODELS_PATH=/app/models
      - HF_HOME=/app/models/huggingface
      - TORCH_HOME=/app/models/torch
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - DOWNLOAD_MODELS=true
      # Set HF_TOKEN in Coolify secrets for gated models
      - HF_TOKEN=${HF_TOKEN}

    volumes:
      # Persistent storage for models - configure path in Coolify
      - models_data:/app/models
      # Persistent storage for GGUF models (downloaded at runtime on first start)
      - gguf_models:/opt/models/qwen-gguf

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  models_data:
    # In Coolify, map this to a host path with sufficient storage (100GB+)
    # Example: /data/imagegen-models
  gguf_models:
    # Storage for GGUF models (~31GB needed for generation + edit models)
    # - qwen-image-2512-Q4_K_M.gguf (~13GB)
    # - qwen-image-edit-2511-Q4_K_M.gguf (~13GB)
    # - Qwen2.5-VL-7B-Instruct-UD-Q4_K_XL.gguf (~4.5GB)
    # - qwen_image_vae.safetensors (~243MB)
    # Downloaded automatically on first container start
    # Example: /data/imagegen-gguf-models
